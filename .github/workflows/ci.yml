name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token and no repository secrets: CI never needs broker or database credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install pinned dependencies
        run: uv sync --frozen
      # Same command as local development: ruff, mypy, pytest, import-linter,
      # capital-literal check, secret scan.
      - name: Check
        run: make check
